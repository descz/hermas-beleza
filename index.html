<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hermas Beleza — Salão de Beleza em Campinas</title>
<meta name="description" content="Salão de beleza em Campinas com nota 4,9 no Google. Unhas, cabelo, sobrancelha e estética com atendimento caprichoso. Av. Dr. Hermas Braga, 134 - Nova Campinas." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  :root {
    --base: #0f0e11; --surface: #171519; --surface-hi: #1f1c22;
    --primary: #e8a4b8; --primary-dim: #c97f98;
    --accent: #f5f2f0; --muted: #9b949a;
    --radius: 14px; --radius-sm: 10px; --maxw: 1140px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { background:var(--base); color:var(--accent); font-family:'Inter',sans-serif; line-height:1.6; -webkit-font-smoothing:antialiased; }
  img { max-width:100%; display:block; }
  a { color:inherit; text-decoration:none; }
  .wrap { max-width:var(--maxw); margin:0 auto; padding:0 24px; }
  .mono { font-family:'JetBrains Mono',monospace; letter-spacing:.06em; text-transform:uppercase; font-size:12px; color:var(--muted); }
  header { position:fixed; top:0; left:0; right:0; z-index:50; background:rgba(15,14,17,.85); backdrop-filter:blur(12px); border-bottom:1px solid rgba(245,242,240,.06); }
  .nav { display:flex; align-items:center; justify-content:space-between; height:64px; }
  .logo { font-family:'Cormorant Garamond',serif; font-weight:700; font-size:24px; letter-spacing:.01em; }
  .logo span { color:var(--primary); }
  .nav-links { display:flex; gap:28px; font-size:14px; color:var(--muted); }
  .nav-links a:hover { color:var(--accent); }
  .btn { display:inline-flex; align-items:center; gap:8px; background:var(--primary); color:#1c0a10; font-weight:600; font-size:14px; padding:12px 22px; border-radius:var(--radius-sm); transition:filter .2s, transform .2s; }
  .btn:hover { filter:brightness(1.1); transform:translateY(-1px); }
  .btn.ghost { background:var(--surface-hi); color:var(--accent); }
  .hamburger { display:none; background:none; border:none; color:var(--accent); font-size:24px; cursor:pointer; }

  .hero { padding:150px 0 80px; position:relative; overflow:hidden; }
  .hero-bg { position:absolute; inset:0; z-index:-1; }
  .hero-bg img { width:100%; height:100%; object-fit:cover; opacity:.28; }
  .hero-bg::after { content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(15,14,17,.6) 0%, var(--base) 94%); }
  .hero .mono { color:var(--primary); }
  h1 { font-family:'Cormorant Garamond',serif; font-weight:700; font-size:clamp(40px,7vw,74px); line-height:1.06; letter-spacing:-.01em; margin:18px 0 20px; max-width:760px; }
  h1 em { font-style:italic; color:var(--primary); }
  .hero p { font-size:18px; color:var(--muted); max-width:560px; margin-bottom:32px; }
  .hero-cta { display:flex; gap:14px; flex-wrap:wrap; }
  .hero-meta { display:flex; gap:24px; margin-top:48px; flex-wrap:wrap; }
  .hero-meta div { display:flex; align-items:center; gap:8px; }
  .stars { color:#f4b942; letter-spacing:2px; }

  section { padding:80px 0; }
  .sec-head { margin-bottom:44px; }
  .sec-head h2 { font-family:'Cormorant Garamond',serif; font-size:clamp(30px,4.5vw,48px); letter-spacing:-.01em; margin-top:10px; }
  .sec-head p { color:var(--muted); margin-top:8px; max-width:560px; }

  .about-grid { display:grid; grid-template-columns:1fr 1fr; gap:48px; align-items:center; }
  .about-grid img { border-radius:var(--radius); box-shadow:0 8px 24px rgba(0,0,0,.5); }
  .about-grid h3 { font-family:'Cormorant Garamond',serif; font-size:26px; margin-bottom:14px; }
  .about-grid p { color:var(--muted); margin-bottom:14px; }
  .hours { display:grid; grid-template-columns:1fr 1fr; gap:8px 32px; margin-top:24px; background:var(--surface); padding:20px; border-radius:var(--radius); }
  .hours .row { display:flex; justify-content:space-between; font-size:14px; gap:12px; }
  .hours .row span:last-child { color:var(--accent); font-weight:500; }

  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:20px; }
  .card { background:var(--surface); border-radius:var(--radius); padding:28px; box-shadow:0 8px 24px rgba(0,0,0,.5); transition:transform .2s, background .2s; }
  .card:hover { transform:translateY(-4px); background:var(--surface-hi); }
  .card .num { font-family:'JetBrains Mono',monospace; color:var(--primary); font-size:13px; }
  .card h3 { font-family:'Cormorant Garamond',serif; font-size:22px; margin:10px 0 8px; }
  .card p { color:var(--muted); font-size:14px; }

  .gallery { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; }
  .gallery img { width:100%; height:240px; object-fit:cover; border-radius:var(--radius); transition:transform .3s, box-shadow .3s; box-shadow:0 4px 16px rgba(0,0,0,.4); }
  .gallery img:hover { transform:scale(1.03); box-shadow:0 8px 28px rgba(232,164,184,.18); }

  .loc { display:grid; grid-template-columns:1fr 1fr; gap:48px; align-items:center; }
  .loc .addr { background:var(--surface); padding:24px; border-radius:var(--radius); margin-bottom:16px; }
  .loc .addr .mono { color:var(--primary); }
  .loc .addr h3 { font-family:'Cormorant Garamond',serif; margin:8px 0; font-size:22px; }
  .loc .addr p { color:var(--muted); font-size:14px; }
  .map { border-radius:var(--radius); overflow:hidden; box-shadow:0 8px 24px rgba(0,0,0,.5); min-height:320px; background:var(--surface-hi); }

  footer { border-top:1px solid rgba(245,242,240,.06); padding:40px 0 56px; }
  footer p { color:var(--muted); font-size:13px; }

  @media(max-width:820px){
    .nav-links { display:none; }
    .hamburger { display:block; }
    .about-grid, .loc, .hours { grid-template-columns:1fr; }
    .hero { padding-top:120px; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.js"></script>
<script>
const h = window.htm.bind(window.React.createElement);
const { useState } = window.React;
const WHATSAPP = "551937613716";
const WA_LINK = `https://wa.me/${WHATSAPP}?text=${encodeURIComponent("Oi! Vim pelo site do Hermas Beleza. Quero agendar um horário.")}`;
const SERVICOS = [
  { n:"01", t:"Manicure e pedicure", d:"Unhas perfeitas com acabamento caprichado e atenção a cada detalhe." },
  { n:"02", t:"Cabelo", d:"Corte, coloração e tratamentos com produtos de qualidade." },
  { n:"03", t:"Sobrancelha", d:"Design que valoriza o seu olhar, com técnica e delicadeza." },
  { n:"04", t:"Estética", d:"Cuidados que renovam e relaxam, do rosto ao corpo." },
];
const GALLERY = ["img/hero-entrada.jpg","img/parede-verde.jpg","img/fachada.jpg","img/ambiente.jpg"];
function App() {
  const [open, setOpen] = useState(false);
  return h`<div>
    <header>
      <div className="wrap nav">
        <div className="logo">Hermas<span>Beleza</span></div>
        <nav className="nav-links">
          <a href="#sobre">Sobre</a><a href="#servicos">Serviços</a>
          <a href="#galeria">Galeria</a><a href="#local">Local</a>
        </nav>
        <a className="btn" href=${WA_LINK} target="_blank" rel="noopener">Agendar no WhatsApp</a>
        <button className="hamburger" onClick=${() => setOpen(!open)}>${open ? "✕" : "☰"}</button>
      </div>
    </header>
    <section className="hero">
      <div className="hero-bg"><img src="img/hero-entrada.jpg" alt="Entrada do Hermas Beleza" /></div>
      <div className="wrap">
        <div className="mono">● Nova Campinas · Campinas · Nota 4,9</div>
        <h1>Beleza que <em>cuida de você</em></h1>
        <p>Unhas, cabelo e estética com atendimento caprichoso, ambiente acolhedor e profissionais que fazem você se sentir especial.</p>
        <div className="hero-cta">
          <a className="btn" href=${WA_LINK} target="_blank" rel="noopener">Chamar no WhatsApp</a>
          <a className="btn ghost" href="#galeria">Ver o espaço</a>
        </div>
        <div className="hero-meta">
          <div><span className="stars">★★★★★</span><span className="mono">4,9 (300+ avaliações)</span></div>
          <div className="mono">Ter–Sáb · 08h30 às 20h</div>
        </div>
      </div>
    </section>
    <section id="sobre">
      <div className="wrap">
        <div className="sec-head"><div className="mono">// O Hermas</div><h2>Capricho em cada detalhe</h2><p>Um salão que trata cada cliente como única — e isso aparece nas avaliações.</p></div>
        <div className="about-grid">
          <img src="img/parede-verde.jpg" alt="Ambiente acolhedor do Hermas" />
          <div>
            <h3>Bem-estar do início ao fim</h3>
            <p>Ambiente bonito e acolhedor, com profissionais atenciosos que entregam um resultado impecável — das mãos aos cabelos.</p>
            <p>A nota 4,9 no Google reflete o cuidado de verdade: cliente que sai daqui, volta.</p>
            <div className="hours">
              <div className="row"><span className="mono">Seg</span><span>Fechado</span></div>
              <div className="row"><span className="mono">Ter – Sáb</span><span>08:30 – 20:00</span></div>
              <div className="row"><span className="mono">Dom</span><span>Fechado</span></div>
            </div>
          </div>
        </div>
      </div>
    </section>
    <section id="servicos">
      <div className="wrap">
        <div className="sec-head"><div className="mono">// Serviços</div><h2>O que a gente faz</h2></div>
        <div className="cards">
          ${SERVICOS.map(m => h`<div className="card" key=${m.n}>
            <div className="num">${m.n}</div><h3>${m.t}</h3><p>${m.d}</p>
          </div>`)}
        </div>
      </div>
    </section>
    <section id="galeria">
      <div className="wrap">
        <div className="sec-head"><div className="mono">// Galeria</div><h2>O nosso espaço</h2></div>
        <div className="gallery">
          ${GALLERY.map((g,i) => h`<img key=${i} src=${g} alt="Fotos reais do Hermas Beleza" loading="lazy" />`)}
        </div>
      </div>
    </section>
    <section id="local">
      <div className="wrap">
        <div className="sec-head"><div className="mono">// Onde estamos</div><h2>Chega mais</h2></div>
        <div className="loc">
          <div>
            <div className="addr">
              <div className="mono">Endereço</div>
              <h3>Hermas Beleza</h3>
              <p>Av. Dr. Hermas Braga, 134 — Nova Campinas<br/>Campinas · SP · 13092-133</p>
            </div>
            <div className="addr">
              <div className="mono">Contato</div>
              <h3>(19) 3761-3716</h3>
              <p>Agendamentos pelo WhatsApp.</p>
            </div>
            <a className="btn" href=${WA_LINK} target="_blank" rel="noopener">Agendar agora</a>
          </div>
          <div className="map">
            <iframe title="Mapa Hermas Beleza" width="100%" height="100%" style=${{border:0,minHeight:"320px"}} loading="lazy" referrerPolicy="no-referrer-when-downgrade"
              src="https://www.google.com/maps?q=Av.%20Dr.%20Hermas%20Braga%2C%20134%20-%20Nova%20Campinas%2C%20Campinas%20-%20SP&output=embed"></iframe>
          </div>
        </div>
      </div>
    </section>
    <footer>
      <div className="wrap">
        <div className="logo">Hermas<span>Beleza</span></div>
        <p style=${{marginTop:"12px"}}>Salão de beleza · Nova Campinas, Campinas · (19) 3761-3716</p>
        <p>© 2026 Hermas Beleza. Todos os direitos reservados.</p>
      </div>
    </footer>
  </div>`;
}
window.ReactDOM.createRoot(document.getElementById('root')).render(h`<${App}/>`);
</script>
</body>
</html>
